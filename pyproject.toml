[project]
name = "pulse"
version = "1.0.0"
description = "Self-hosted uptime monitor with a public status page."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools]
packages = ["pulse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
